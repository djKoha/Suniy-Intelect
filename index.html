      --ai-border: rgba(148, 163, 184, 0.5);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: #e5e7eb;
      overflow-x: hidden;
    }

    /* 🔮 AI фон — анимацияланган градиент */
    .ai-bg-animated {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: linear-gradient(
        120deg,
        #020617,
        #020617,
        #0f172a,
        #1e293b,
        #0369a1,
        #22c55e
      );
      background-size: 400% 400%;
      animation: gradientMove 18s ease infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 🔵 AI “blob” нурлари */
    .ai-orb {
      position: fixed;
      border-radius: 999px;
      filter: blur(40px);
      opacity: 0.45;
      z-index: -1;
      pointer-events: none;
    }

    .ai-orb.orb-1 {
      width: 320px;
      height: 320px;
      background: #22c55e;
      top: -60px;
      left: -40px;
      animation: floatOrb1 22s ease-in-out infinite alternate;
    }

    .ai-orb.orb-2 {
      width: 280px;
      height: 280px;
      background: #0ea5e9;
      bottom: -80px;
      right: -40px;
      animation: floatOrb2 24s ease-in-out infinite alternate;
    }

    .ai-orb.orb-3 {
      width: 220px;
      height: 220px;
      background: #a855f7;
      top: 40%;
      left: 60%;
      animation: floatOrb3 26s ease-in-out infinite alternate;
    }

    @keyframes floatOrb1 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(80px, 60px); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-60px, -40px); }
    }
    @keyframes floatOrb3 {
      0% { transform: translate(-40px, 20px); }
      100% { transform: translate(30px, -30px); }
    }

    /* 📦 Чат контейнер */
    .chat-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .chat-card {
      width: 100%;
      max-width: 540px;
      background: radial-gradient(circle at top left, #0b1120, #020617);
      border-radius: 1.75rem;
      border: 1px solid var(--ai-border);
      box-shadow:

        0 0 0 1px rgba(15, 23, 42, 0.9);
      padding: 1.4rem 1.2rem 1.3rem;
      position: relative;
      overflow: hidden;
    }

    .chat-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right,
        rgba(34, 197, 94, 0.12),
        transparent 55%);
      opacity: 0.85;
      pointer-events: none;
    }

    .chat-card-inner {
      position: relative;
      z-index: 2;
    }

      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.75rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.8);
      background: linear-gradient(

        rgba(15, 23, 42, 0.85),
        rgba(15, 23, 42, 0.95)

      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #e5e7eb;
      margin-bottom: 0.6rem;

    .ai-pill i {
      font-size: 0.95rem;
      color: #22c55e;
    }

    .chat-title {
      font-size: clamp(1.4rem, 3vw, 1.7rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(to right, #bbf7d0, #facc15, #38bdf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.3rem;
    }

    .chat-subtitle {
      font-size: 0.9rem;
      color: #9ca3af;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .chat-subtitle i {
      color: #22c55e;
    }

      margin-top: 0.35rem;
    }

      border-right: none;
      font-size: 0.9rem;
      background: rgba(15, 23, 42, 0.8);
      border-color: rgba(148, 163, 184, 0.7);

      border-color: rgba(148, 163, 184, 0.7);
    }

      border-radius: 0 999px 999px 0;

      border-color: rgba(148, 163, 184, 0.7);
      color: #e5e7eb;

      border-color: #22c55e !important;
      color: #022c22 !important;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.9);

    #askBtn {
      background: linear-gradient(120deg, #22c55e, #0ea5e9);
      color: #020617;
      border: none;
      font-weight: 600;
      padding-inline: 0.9rem;
    }

    #askBtn:hover {
      filter: brightness(1.08);
    }

    /* Javob oynasi */
    .ai-answer-box {
      margin-top: 0.8rem;
      padding: 0.75rem 0.9rem;
      border-radius: 0.9rem;
      background: radial-gradient(circle at top left,
        rgba(15, 23, 42, 0.95),
        rgba(15, 23, 42, 0.98));
      border: 1px solid rgba(148, 163, 184, 0.8);
      font-size: 0.9rem;
      color: #e5e7eb;
      min-height: 52px;
      white-space: pre-wrap;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.9);
      position: relative;
      overflow: hidden;
    }

    .ai-answer-box::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        rgba(34, 197, 94, 0.15),
        transparent 40%,
        rgba(56, 189, 248, 0.15)
      );
      mix-blend-mode: soft-light;
      opacity: 0.8;
      pointer-events: none;
    }

    .ai-answer-box .muted {
      opacity: 0.8;
      font-style: italic;
      color: #9ca3af;
    }

    .ai-answer-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #6b7280;
      margin-top: 0.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .ai-answer-label i {
      font-size: 0.85rem;
      color: #22c55e;
    }

    @media (max-width: 575.98px) {
      .chat-card {
        padding: 1.2rem 1rem 1.1rem;
        border-radius: 1.4rem;
      }
      .chat-title {
        font-size: 1.3rem;
      }
      .chat-subtitle {
        font-size: 0.85rem;
      }
    }

    const askBtn = document.getElementById('askBtn');
    const micBtn = document.getElementById('micBtn');

    async function askAi() {
      const question = aiQuestionInput.value.trim();
      if (!question) return;

      if (!OPENAI_API_KEY || OPENAI_API_KEY === "PUT_YOUR_API_KEY_HERE") {
        aiAnswerBox.innerHTML = "⚠️ Avval OpenAI API kalitingizni xavfsiz tarzda backend'ga joylashtiring.";
        return;
      }

      aiAnswerBox.textContent = "⏳ Javob tayyorlanmoqda...";

      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
           
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
              {
                role: "system",
                content: `
Sen "AI Bojxona yordamchi"sан.

SENING VAZIFANG:
1) Avval pastdagi "Bojxona qoidalari" matnidan javob topishga harakat qil.
2) Agar savolga yetarli javob shu matnda bo'lsa:
   - javobni aynan shu qoidalarga tayangan holda yoz;
   - javob ichida qisqa eslat: "Bu javob 01.05.2025-yil broshyura ma'lumotiga asoslangan".
3) Agar matnda yetarli aniq ma'lumot bo'lmasa yoki savol umuman boshqa mavzu (masalan, boshqa davlat qonuni, turizm, valyutadan tashqari moliya va hokazo) haqida bo'lsa:
   - unda sen umumiy ChatGPT bilimlaringdan foydalanishing mumkin;
   - lekin javob oxirida albatta shunday yoz:
     "Bu qism umumiy ma'lumot bo'lib, rasmiy bojxona organlari bilan tasdiqlab oling."
4) Agar savol juda tushunarsiz bo'lsa (qisqa, mavzusi noaniq):
   - avval juda qisqa aniqlashtiruvchi savol ber, masalan:
     "Valyuta, maishiy texnika, oziq-ovqat yoki boshqa qaysi bo'lim bo'yicha so'rayapsiz?"
   - keyin aniqlashgandan so'ng javob ber.
5) Hech qachon o'zingcha yangi raqamlar (USD, kg, kun, oy) uydirma qilib qo'shma. Faqat:
   - broshyura matnidagi,
   - yoki umumiy bilimlaringda ishonching yuqori bo'lgan raqamlarni ishlat.
6) Javoblar o'zbek tilida, sodda, aniq va foydalanuvchi uchun amaliy bo'lsin.
                `.trim()
              },
              {
                role: "system",
                content: "Bojxona qoidalari (01.05.2025 holati bo'yicha broshyura matni):\n\n" + BOJXONA_QOIDALARI
              },
              {
                role: "user",
                content: question
              }
            ],
            temperature: 0.15
          })
        });

        const data = await response.json();
        const text = data?.choices?.[0]?.message?.content || "Javobni olishda xatolik yuz berdi.";
        aiAnswerBox.textContent = text;
      } catch (error) {
        console.error(error);
        aiAnswerBox.textContent = "❌ Xatolik yuz berdi. Internet yoki API kalitni tekshiring.";
      }
    }

    askBtn.addEventListener('click', askAi);
    aiQuestionInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        askAi();
      }
    });

    // 🎙️ Ovozli kiritish
    let recognition;
    let isListening = false;

    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'uz-UZ';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        aiQuestionInput.value = transcript;
        aiAnswerBox.innerHTML = "⏳ Javob tayyorlanmoqda...";
        askAi();
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('active');
        micBtn.innerHTML = '<i class="bi bi-mic-fill"></i>';
      };
    } else {
      micBtn.addEventListener('click', () => {
        alert("Brauzeringiz mikrofondan foydalanishni qo'llab-quvvatlamaydi.");
      });
    }

    if (micBtn && recognition) {
      micBtn.addEventListener('click', () => {
        if (!isListening) {
          isListening = true;
          micBtn.classList.add('active');
          micBtn.innerHTML = '<i class="bi bi-record-fill"></i>';
          recognition.start();
        } else {
          recognition.stop();
        }
      });
    }
  </script>
</body>
</html>
